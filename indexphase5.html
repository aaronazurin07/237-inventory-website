<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Command Center</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,.06);
      --panel-border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --danger:#ff5c6c;
      --shadow:0 20px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(79,140,255,.25), transparent 60%),
        radial-gradient(700px 450px at 80% 20%, rgba(106,228,255,.18), transparent 60%),
        radial-gradient(900px 700px at 50% 90%, rgba(255,92,108,.12), transparent 60%),
        var(--bg);
      padding:28px;
    }
    .container{
      width:100%; max-width:900px;
      background:var(--panel);
      border:1px solid var(--panel-border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:22px 22px 18px;
      backdrop-filter:blur(10px);
    }
    header{
      display:flex; align-items:baseline; justify-content:space-between; gap:16px;
      padding:6px 4px 14px; border-bottom:1px solid rgba(255,255,255,.10);
      margin-bottom:16px;
    }
    h1{margin:0; font-size:clamp(1.2rem,3vw,1.8rem); letter-spacing:.3px}
    .subtle{margin:0; color:var(--muted); font-size:.95rem; white-space:nowrap}

    .grid{
      display:grid;
      grid-template-columns: 1.4fr 0.8fr auto;
      gap:12px;
      align-items:end;
      padding:4px;
    }
    label{display:block; font-size:.85rem; color:var(--muted); margin:0 0 6px}
    input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(0,0,0,.25);
      color:var(--text);
      outline:none;
      transition:border-color 140ms ease, box-shadow 140ms ease;
    }
    input::placeholder{color:rgba(255,255,255,.45)}
    input:focus{
      border-color:rgba(79,140,255,.65);
      box-shadow:0 0 0 3px rgba(79,140,255,.18);
    }
    button{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:linear-gradient(135deg, rgba(79,140,255,.95), rgba(106,228,255,.55));
      color:#07101f;
      font-weight:700;
      cursor:pointer;
      transition:transform 120ms ease, filter 120ms ease;
      white-space:nowrap;
    }
    button:hover{filter:brightness(1.06)}
    button:active{transform:translateY(1px)}
    .btn-danger{
      background:rgba(255,92,108,.22);
      color:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.14);
    }

    .feedback{
      margin:10px 4px 0;
      min-height:20px;
      font-size:.9rem;
      color:var(--muted);
    }
    .feedback.error{color:var(--danger)}
    .feedback.success{color:rgba(106,228,255,.95)}

    .list-wrap{
      margin-top:16px;
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:14px;
    }
    .list-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:0 4px 10px;
      flex-wrap:wrap;
    }
    .pill{
      font-size:.85rem;
      color:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      border-radius:999px;
      padding:6px 10px;
    }

    ul{list-style:none; padding:0; margin:0; display:grid; gap:10px}
    .item{
      display:grid;
      grid-template-columns: 1fr auto auto;
      gap:10px;
      align-items:center;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.18);
    }
    .item-name{
      font-weight:650;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
    }

    .qty-controls{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .qty{
      color:rgba(255,255,255,.82);
      font-variant-numeric:tabular-nums;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      white-space:nowrap;
    }
    .pm{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:rgba(255,255,255,.92);
      cursor:pointer;
      font-weight:900;
      line-height:1;
      user-select:none;
      min-width:40px;
    }
    .pm:hover{filter:brightness(1.08)}
    .pm:active{transform:translateY(1px)}

    select.step{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:rgba(255,255,255,.92);
      outline:none;
    }

    .remove{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,92,108,.18);
      color:rgba(255,255,255,.92);
      cursor:pointer;
      font-weight:650;
    }
    .remove:hover{filter:brightness(1.05)}

    .empty{
      color:rgba(255,255,255,.60);
      padding:14px 8px;
      text-align:center;
      border:1px dashed rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(0,0,0,.12);
    }

    .chart-wrap{
      margin-top:16px;
      padding:14px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.14);
    }
    .chart-title{
      margin:0 0 10px;
      font-size:.95rem;
      color:rgba(255,255,255,.85);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .chart-canvas-wrap{position:relative; height:320px; width:100%}

    @media (max-width: 780px){
      .grid{grid-template-columns:1fr}
      button{width:100%}
      header{flex-direction:column; align-items:flex-start}
      .subtle{white-space:normal}
      .item{grid-template-columns:1fr}
      .qty-controls{justify-content:flex-start}
      .chart-canvas-wrap{height:280px}
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Inventory Command Center</h1>
      <p class="subtle">Saved locally · Persists after refresh</p>
    </header>

    <section class="grid" aria-label="Add or update inventory item">
      <div>
        <label for="itemName">Item Name</label>
        <input id="itemName" type="text" placeholder="e.g., USB-C Cable" autocomplete="off" />
      </div>

      <div>
        <label for="quantity">Quantity (0 allowed)</label>
        <input id="quantity" inputmode="numeric" placeholder="e.g., 0" />
      </div>

      <div style="display:grid; gap:10px;">
        <button id="saveBtn" type="button">Add / Update</button>
        <button id="clearAllBtn" type="button" class="btn-danger">Clear All Items</button>
      </div>
    </section>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

    <section class="list-wrap" aria-label="Inventory list">
      <div class="list-header">
        <div class="pill">Items: <span id="count">0</span></div>
        <div class="pill">Low stock: &lt; 10</div>
        <div class="pill">Step options: 10–1000</div>
      </div>

      <ul id="inventoryList"></ul>
      <div id="emptyState" class="empty" hidden>No items yet. Add your first item above.</div>

      <div class="chart-wrap" aria-label="Inventory chart">
        <div class="chart-title">
          <span class="pill">Quantity by Item</span>
          <span class="pill">Auto-updates</span>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="inventoryChart" aria-label="Bar chart of inventory quantities" role="img"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    (function () {
      const STORAGE_KEY = "inventory_command_center_v2";
      const LEGACY_KEY = "inventory_command_center_v1";
      const LOW_STOCK_THRESHOLD = 10;

      const itemNameEl = document.getElementById("itemName");
      const quantityEl = document.getElementById("quantity");
      const saveBtn = document.getElementById("saveBtn");
      const clearAllBtn = document.getElementById("clearAllBtn");
      const listEl = document.getElementById("inventoryList");
      const feedbackEl = document.getElementById("feedback");
      const countEl = document.getElementById("count");
      const emptyStateEl = document.getElementById("emptyState");

      const chartCanvas = document.getElementById("inventoryChart");
      let chart = null;

      // Inventory stored as array to preserve original spelling:
      // { id, name, matchKey, qty }
      let inventory = loadInventory();

      function setFeedback(message, type = "") {
        feedbackEl.textContent = message || "";
        feedbackEl.className = "feedback" + (type ? " " + type : "");
      }

      function normalizeNameDisplay(name) {
        // Keep user’s original casing/spaces mostly, but trim and collapse spaces
        return name.trim().replace(/\s+/g, " ");
      }

      // Stronger "duplicate" normalization to catch capitalization + repeated-letter typos like usbbb / Uussb
      function normalizeForMatch(name) {
        // Lowercase, keep alphanumerics only, compress repeated consecutive letters/numbers
        const cleaned = name.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (!cleaned) return "";
        let out = cleaned[0];
        for (let i = 1; i < cleaned.length; i++) {
          if (cleaned[i] !== cleaned[i - 1]) out += cleaned[i];
        }
        return out;
      }

      // Small edit-distance to catch minor typos beyond repeated letters (best-effort)
      function levenshtein(a, b) {
        const m = a.length, n = b.length;
        if (m === 0) return n;
        if (n === 0) return m;

        const dp = new Array(n + 1);
        for (let j = 0; j <= n; j++) dp[j] = j;

        for (let i = 1; i <= m; i++) {
          let prev = dp[0];
          dp[0] = i;
          for (let j = 1; j <= n; j++) {
            const temp = dp[j];
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            dp[j] = Math.min(
              dp[j] + 1,       // deletion
              dp[j - 1] + 1,   // insertion
              prev + cost      // substitution
            );
            prev = temp;
          }
        }
        return dp[n];
      }

      function findDuplicateByFuzzy(matchKey) {
        // Exact matchKey first
        const exact = inventory.find(it => it.matchKey === matchKey);
        if (exact) return exact;

        // Fuzzy: allow small edit distance for similar-length keys (best-effort)
        // This helps catch minor typos, but avoids merging totally different names.
        for (const it of inventory) {
          const a = matchKey, b = it.matchKey;
          const lenDiff = Math.abs(a.length - b.length);
          if (lenDiff > 2) continue;
          const d = levenshtein(a, b);
          if (d <= 1) return it; // conservative
        }
        return null;
      }

      function parseQuantity(raw) {
        // Must be digits only (no alpha-numeric, no signs, no decimals). 0 allowed.
        const s = String(raw).trim();
        if (!/^\d+$/.test(s)) return { ok: false, value: null };
        const num = Number(s);
        if (!Number.isFinite(num)) return { ok: false, value: null };
        // num >= 0 guaranteed by regex
        return { ok: true, value: num };
      }

      function loadInventory() {
        // Load v2 first
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return sanitizeInventory(parsed);
          }
        } catch {}

        // Migrate v1 if present
        try {
          const rawLegacy = localStorage.getItem(LEGACY_KEY);
          if (rawLegacy) {
            const parsed = JSON.parse(rawLegacy);
            if (parsed && typeof parsed === "object") {
              const migrated = Object.entries(parsed).map(([k, qty]) => {
                const name = normalizeNameDisplay(k);
                const matchKey = normalizeForMatch(name);
                return {
                  id: matchKey || k,
                  name,
                  matchKey,
                  qty: Number.isFinite(Number(qty)) ? Math.max(0, Math.floor(Number(qty))) : 0
                };
              });
              localStorage.removeItem(LEGACY_KEY);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
              return sanitizeInventory(migrated);
            }
          }
        } catch {}

        return [];
      }

      function sanitizeInventory(items) {
        // Remove bad entries, enforce unique matchKey
        const out = [];
        const seen = new Set();
        for (const it of items) {
          if (!it || typeof it !== "object") continue;
          const name = normalizeNameDisplay(String(it.name ?? ""));
          const matchKey = normalizeForMatch(name);
          if (!matchKey) continue;
          if (seen.has(matchKey)) continue;
          const qty = Number.isFinite(Number(it.qty)) ? Math.max(0, Math.floor(Number(it.qty))) : 0;
          seen.add(matchKey);
          out.push({ id: matchKey, name, matchKey, qty });
        }
        return out;
      }

      function saveInventory() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
      }

      function clearInventoryStorage() {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LEGACY_KEY);
      }

      function getSortedEntries() {
        return [...inventory].sort((a, b) => a.name.localeCompare(b.name));
      }

      function colorsForData(values) {
        return values.map(v => (v < LOW_STOCK_THRESHOLD ? "rgba(255, 92, 108, 0.75)" : "rgba(79, 140, 255, 0.75)"));
      }

      function borderColorsForData(values) {
        return values.map(v => (v < LOW_STOCK_THRESHOLD ? "rgba(255, 92, 108, 1)" : "rgba(79, 140, 255, 1)"));
      }

      function initChart() {
        const entries = getSortedEntries();
        const labels = entries.map(e => e.name);
        const data = entries.map(e => e.qty);

        chart = new Chart(chartCanvas, {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "Quantity",
              data,
              backgroundColor: colorsForData(data),
              borderColor: borderColorsForData(data),
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "rgba(255,255,255,0.85)" } },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const v = ctx.parsed.y;
                    const flag = v < LOW_STOCK_THRESHOLD ? " (LOW STOCK)" : "";
                    return ` ${ctx.dataset.label}: ${v}${flag}`;
                  }
                },
                titleColor: "rgba(255,255,255,0.92)",
                bodyColor: "rgba(255,255,255,0.92)"
              }
            },
            scales: {
              x: { ticks: { color: "rgba(255,255,255,0.75)" }, grid: { color: "rgba(255,255,255,0.10)" } },
              y: { beginAtZero: true, ticks: { color: "rgba(255,255,255,0.75)", precision: 0 }, grid: { color: "rgba(255,255,255,0.10)" } }
            }
          }
        });
      }

      function updateChart() {
        const entries = getSortedEntries();
        const labels = entries.map(e => e.name);
        const data = entries.map(e => e.qty);

        if (!chart) {
          initChart();
          return;
        }
        chart.data.labels = labels;
        chart.data.datasets[0].data = data;
        chart.data.datasets[0].backgroundColor = colorsForData(data);
        chart.data.datasets[0].borderColor = borderColorsForData(data);
        chart.update();
      }

      function renderList() {
        listEl.innerHTML = "";

        const entries = getSortedEntries();
        countEl.textContent = String(entries.length);
        emptyStateEl.hidden = entries.length !== 0;

        for (const entry of entries) {
          const li = document.createElement("li");
          li.className = "item";

          const name = document.createElement("div");
          name.className = "item-name";
          name.textContent = entry.name;
          name.title = "Click to load into input for editing";
          name.addEventListener("click", () => {
            itemNameEl.value = entry.name; // preserve the saved “correct spelling”
            quantityEl.value = String(entry.qty);
            itemNameEl.focus();
            itemNameEl.select();
            setFeedback(`Loaded "${entry.name}" for editing.`, "");
          });

          const controls = document.createElement("div");
          controls.className = "qty-controls";

          const qty = document.createElement("div");
          qty.className = "qty";
          qty.textContent = "Qty: " + entry.qty;

          const minus = document.createElement("button");
          minus.className = "pm";
          minus.type = "button";
          minus.textContent = "−";
          minus.setAttribute("aria-label", "Decrease quantity");

          const stepSelect = document.createElement("select");
          stepSelect.className = "step";
          stepSelect.setAttribute("aria-label", "Step size");
          // Options: 10..1000 by 10 (as requested)
          for (let v = 10; v <= 1000; v += 10) {
            const opt = document.createElement("option");
            opt.value = String(v);
            opt.textContent = `±${v}`;
            stepSelect.appendChild(opt);
          }
          stepSelect.value = "10";

          const plus = document.createElement("button");
          plus.className = "pm";
          plus.type = "button";
          plus.textContent = "+";
          plus.setAttribute("aria-label", "Increase quantity");

          function applyDelta(delta) {
            const idx = inventory.findIndex(it => it.matchKey === entry.matchKey);
            if (idx === -1) return;
            const current = inventory[idx].qty;
            const next = current + delta;
            inventory[idx].qty = Math.max(0, next); // 0 allowed, no negatives
            saveInventory();
            renderAll();
          }

          minus.addEventListener("click", () => {
            const step = Number(stepSelect.value);
            applyDelta(-step);
            setFeedback(`Updated "${entry.name}".`, "success");
          });

          plus.addEventListener("click", () => {
            const step = Number(stepSelect.value);
            applyDelta(step);
            setFeedback(`Updated "${entry.name}".`, "success");
          });

          controls.appendChild(qty);
          controls.appendChild(minus);
          controls.appendChild(stepSelect);
          controls.appendChild(plus);

          const remove = document.createElement("button");
          remove.className = "remove";
          remove.type = "button";
          remove.textContent = "Remove";
          remove.addEventListener("click", () => {
            inventory = inventory.filter(it => it.matchKey !== entry.matchKey);
            saveInventory();
            renderAll();
            setFeedback("Item removed.", "success");
          });

          li.appendChild(name);
          li.appendChild(controls);
          li.appendChild(remove);
          listEl.appendChild(li);
        }
      }

      function renderAll() {
        renderList();
        updateChart();
      }

      function addOrUpdateItem() {
        const rawName = normalizeNameDisplay(itemNameEl.value);
        if (!rawName) {
          setFeedback("Item Name is required.", "error");
          itemNameEl.focus();
          return;
        }

        const parsed = parseQuantity(quantityEl.value);
        if (!parsed.ok) {
          setFeedback("Quantity must be a number (digits only). 0 is allowed. No negatives/letters/decimals.", "error");
          quantityEl.focus();
          return;
        }

        const matchKey = normalizeForMatch(rawName);
        if (!matchKey) {
          setFeedback("Item Name must contain letters/numbers.", "error");
          itemNameEl.focus();
          return;
        }

        const dup = findDuplicateByFuzzy(matchKey);

        // If it matches an existing item (even via typos), update that item and keep its original spelling.
        if (dup) {
          const idx = inventory.findIndex(it => it.matchKey === dup.matchKey);
          inventory[idx].qty = Math.floor(parsed.value);
          saveInventory();
          renderAll();
          setFeedback(`Updated existing item "${inventory[idx].name}". (Input matched an existing item; spelling kept.)`, "success");
          itemNameEl.value = "";
          quantityEl.value = "";
          itemNameEl.focus();
          return;
        }

        // Otherwise add a new item; keep this spelling as the stored "correct" spelling.
        inventory.push({
          id: matchKey,
          name: rawName,
          matchKey,
          qty: Math.floor(parsed.value)
        });

        saveInventory();
        renderAll();
        setFeedback("Item added.", "success");
        itemNameEl.value = "";
        quantityEl.value = "";
        itemNameEl.focus();
      }

      function clearAllItems() {
        const hadAny = inventory.length > 0;
        inventory = [];
        clearInventoryStorage();

        if (chart) {
          chart.destroy();
          chart = null;
        }
        renderList();
        initChart();

        setFeedback(hadAny ? "All items cleared (list, localStorage, and chart reset)." : "Nothing to clear.", hadAny ? "success" : "");
        itemNameEl.value = "";
        quantityEl.value = "";
        itemNameEl.focus();
      }

      saveBtn.addEventListener("click", addOrUpdateItem);
      clearAllBtn.addEventListener("click", clearAllItems);

      [itemNameEl, quantityEl].forEach((el) => {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addOrUpdateItem();
        });
      });

      // Initial render
      renderAll();
    })();
  </script>
</body>
</html>
